; credentials/config.ini にコピーし、NTFS ACL でタスクの実行アカウントと管理者だけが読めるようにする。
; GA4 の数値のプロパティ ID（「G-」で始まる測定 ID ではない）。GA4 管理 > プロパティの詳細で確認する。
property_id=REPLACE_WITH_NUMERIC_PROPERTY_ID
; happa-ga4-reader のサービスアカウント鍵（JSON）。相対パスはこのフォルダ基準。
key_file=credentials/happa-ga4-reader.json
; Windows の PHP で curl が CA 証明書を見つけられない場合に指定する（X 自動投稿プラグインの同梱ファイルを使える）。
ca_bundle=C:\inetpub\wwwroot\geeklog\2_2_2\plugins\xpost\certs\cacert.pem
timezone=Asia/Tokyo
history_days=90
